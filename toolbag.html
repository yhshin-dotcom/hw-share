<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HW 공구가방 관리</title>
</head>
<body>
<!-- ============================================================
     HW 공구가방 인벤토리 — 정적 단일 파일 앱
     저장: 품목 데이터 = localStorage, 사진 = IndexedDB(자동 축소)
     외부 네트워크 요청 없음 / 폰·PC 브라우저에서 동작
     ============================================================ -->
<style>
  :root{
    /* neutrals biased toward steel-blue */
    --bg:#eef1f5;
    --surface:#ffffff;
    --surface-2:#f6f8fb;
    --line:#d8dee7;
    --line-strong:#c3ccd8;
    --ink:#1b232d;
    --ink-2:#4a5768;
    --muted:#7a8697;
    --accent:#2f6f9e;
    --accent-ink:#ffffff;
    --accent-soft:#e5eff6;
    --danger:#b0483f;
    --warn:#b07d1f;
    --ok:#3f7a54;
    --shadow:0 1px 2px rgba(20,30,45,.06),0 6px 18px rgba(20,30,45,.06);
    --radius:14px;
    --radius-sm:10px;
    /* category hues */
    --c-gong:#2f6f9e; --c-bolt:#8a6d3b; --c-so:#4a8a5c; --c-fin:#7a5aa6;
    --c-cable:#c2703d; --c-plas:#3f9aa6; --c-pcb:#b0483f; --c-etc:#6b7280;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f151c; --surface:#18212c; --surface-2:#1e2833; --line:#2a3542;
      --line-strong:#374552; --ink:#e7ecf2; --ink-2:#adb9c7; --muted:#7f8b9a;
      --accent:#5aa6d6; --accent-ink:#0b1218; --accent-soft:#1a2c3a;
      --danger:#e07a70; --warn:#d6a748; --ok:#68b487;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="light"]{
    --bg:#eef1f5; --surface:#ffffff; --surface-2:#f6f8fb; --line:#d8dee7;
    --line-strong:#c3ccd8; --ink:#1b232d; --ink-2:#4a5768; --muted:#7a8697;
    --accent:#2f6f9e; --accent-ink:#ffffff; --accent-soft:#e5eff6;
    --danger:#b0483f; --warn:#b07d1f; --ok:#3f7a54;
    --shadow:0 1px 2px rgba(20,30,45,.06),0 6px 18px rgba(20,30,45,.06);
  }
  :root[data-theme="dark"]{
    --bg:#0f151c; --surface:#18212c; --surface-2:#1e2833; --line:#2a3542;
    --line-strong:#374552; --ink:#e7ecf2; --ink-2:#adb9c7; --muted:#7f8b9a;
    --accent:#5aa6d6; --accent-ink:#0b1218; --accent-soft:#1a2c3a;
    --danger:#e07a70; --warn:#d6a748; --ok:#68b487;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans KR",sans-serif;
    font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 14px 120px;}

  /* ---- top bar ---- */
  header.app{
    position:sticky;top:0;z-index:40;background:var(--bg);
    padding:14px 0 10px; border-bottom:1px solid var(--line);
  }
  .titlebar{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto;padding:0 14px;}
  .brand{display:flex;align-items:baseline;gap:9px;flex:1;min-width:0;}
  .brand h1{font-size:18px;font-weight:750;letter-spacing:-.02em;margin:0;white-space:nowrap;}
  .brand .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .iconbtn{
    appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);
    width:38px;height:38px;border-radius:10px;font-size:16px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
  }
  .iconbtn:hover{border-color:var(--accent);color:var(--accent);}

  /* ---- bag switcher ---- */
  .segmented{display:flex;gap:6px;background:var(--surface-2);border:1px solid var(--line);
    border-radius:12px;padding:5px;margin:12px auto 0;max-width:760px;}
  .seg{flex:1;appearance:none;border:0;background:transparent;color:var(--ink-2);
    font-weight:650;font-size:14px;padding:9px 8px;border-radius:8px;cursor:pointer;letter-spacing:-.01em;
    display:flex;align-items:center;justify-content:center;gap:7px;}
  .seg .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600;}
  .seg[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);}
  .seg[aria-selected="true"] .cnt{color:var(--accent-ink);opacity:.85;}

  /* ---- toolbar ---- */
  .toolbar{display:flex;gap:8px;margin-top:12px;align-items:center;}
  .search{flex:1;position:relative;min-width:0;}
  .search input{width:100%;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
    border-radius:10px;padding:10px 12px 10px 34px;font-size:15px;}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);}
  select.sort{appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
    border-radius:10px;padding:10px 30px 10px 12px;font-size:14px;cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 15px) 18px,calc(100% - 10px) 18px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
  input:focus,select:focus,button:focus-visible,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}

  .summary{display:flex;gap:14px;margin-top:12px;color:var(--muted);font-size:12.5px;align-items:center;flex-wrap:wrap;}
  .summary b{color:var(--ink-2);font-variant-numeric:tabular-nums;}
  .summary .dot{width:5px;height:5px;border-radius:50%;background:var(--line-strong);}

  /* ---- category section ---- */
  .cat{margin-top:18px;}
  .cat-head{display:flex;align-items:center;gap:9px;position:sticky;top:var(--headerH,63px);z-index:20;
    background:var(--bg);padding:7px 2px;margin-bottom:2px;}
  .cat-chip{width:11px;height:11px;border-radius:3px;flex:0 0 auto;}
  .cat-head h2{font-size:13px;font-weight:750;letter-spacing:.01em;margin:0;text-transform:none;}
  .cat-head .n{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600;
    background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:1px 8px;}
  .cat-head .line{flex:1;height:1px;background:var(--line);}

  /* ---- item card ---- */
  .grid{display:grid;grid-template-columns:1fr;gap:8px;}
  @media(min-width:620px){.grid{grid-template-columns:1fr 1fr;}}
  .item{display:flex;gap:11px;align-items:center;background:var(--surface);border:1px solid var(--line);
    border-left:3px solid var(--catc,var(--line-strong));border-radius:var(--radius-sm);padding:9px 10px;box-shadow:var(--shadow);}
  .thumb{width:46px;height:46px;border-radius:9px;flex:0 0 auto;background:var(--surface-2);border:1px solid var(--line);
    display:grid;place-items:center;overflow:hidden;cursor:pointer;position:relative;}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb .ph{color:var(--muted);font-size:17px;}
  .thumb.hasimg::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);border-radius:9px;}
  .it-main{flex:1;min-width:0;}
  .it-name{font-weight:600;font-size:14.5px;line-height:1.3;word-break:break-word;}
  .it-note{font-size:12px;color:var(--muted);margin-top:2px;word-break:break-word;}
  .it-right{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
  .stepper{display:flex;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;overflow:hidden;}
  .stepper button{appearance:none;border:0;background:transparent;color:var(--ink-2);width:30px;height:32px;font-size:17px;cursor:pointer;line-height:1;}
  .stepper button:hover{background:var(--accent-soft);color:var(--accent);}
  .qty{min-width:44px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;padding:0 2px;}
  .qty .u{font-weight:500;font-size:11px;color:var(--muted);margin-left:1px;}
  .kebab{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);
    width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:15px;line-height:1;}
  .kebab:hover{border-color:var(--accent);color:var(--accent);}

  .empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px;}
  .empty .big{font-size:32px;margin-bottom:8px;}

  /* ---- FAB ---- */
  .fab{position:fixed;right:max(16px,calc(50% - 380px + 16px));bottom:calc(20px + env(safe-area-inset-bottom));z-index:45;
    appearance:none;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;
    padding:14px 20px;border-radius:30px;box-shadow:0 6px 20px rgba(20,40,60,.28);cursor:pointer;display:flex;align-items:center;gap:8px;}
  .fab:active{transform:translateY(1px);}

  /* ---- modal / sheet ---- */
  .scrim{position:fixed;inset:0;background:rgba(15,22,30,.5);z-index:60;display:none;}
  .scrim.on{display:block;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--surface);
    border-radius:18px 18px 0 0;max-width:760px;margin:0 auto;max-height:92vh;overflow:auto;
    transform:translateY(100%);transition:transform .22s ease;padding:16px 16px calc(20px + env(safe-area-inset-bottom));}
  .sheet.on{transform:translateY(0);}
  @media(prefers-reduced-motion:reduce){.sheet{transition:none;}}
  .sheet h3{margin:2px 0 14px;font-size:17px;font-weight:750;}
  .grabber{width:40px;height:4px;border-radius:3px;background:var(--line-strong);margin:0 auto 12px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;font-weight:650;color:var(--ink-2);margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--line-strong);background:var(--surface-2);
    color:var(--ink);border-radius:10px;padding:11px 12px;font-size:15px;font-family:inherit;}
  .field textarea{resize:vertical;min-height:56px;}
  .row2{display:flex;gap:10px;}.row2>*{flex:1;min-width:0;}
  .photo-field{display:flex;gap:12px;align-items:center;}
  .photo-prev{width:66px;height:66px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);
    overflow:hidden;display:grid;place-items:center;flex:0 0 auto;color:var(--muted);}
  .photo-prev img{width:100%;height:100%;object-fit:cover;}
  .photo-prev.dragover{outline:2px dashed var(--accent);outline-offset:2px;}
  .btn{appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
    border-radius:10px;padding:10px 14px;font-size:14px;font-weight:650;cursor:pointer;}
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .btn.primary:hover{filter:brightness(1.05);color:var(--accent-ink);}
  .btn.danger{color:var(--danger);border-color:var(--danger);}
  .btn.armed{background:var(--danger)!important;border-color:var(--danger)!important;color:#fff!important;}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--muted);}
  .sheet-actions{display:flex;gap:10px;margin-top:8px;}
  .sheet-actions .btn{flex:1;padding:12px;}
  .datalist-note{font-size:11.5px;color:var(--muted);margin-top:5px;}

  /* ---- photo view: alternative layouts (v / fold / filter) ---- */
  .catfold .cat{margin-top:10px;}
  .catfold .cat-head{position:static;cursor:pointer;background:var(--surface);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;user-select:none;}
  .catfold .cat-head:hover{border-color:var(--accent);}
  .catfold .cat-head .chev{margin-left:2px;color:var(--muted);font-size:11px;transition:transform .15s;}
  .catfold .cat.folded .grid{display:none;}
  .catfold .cat.folded .cat-head .chev{transform:rotate(-90deg);}
  .catfold .grid{margin-top:8px;}
  @media(prefers-reduced-motion:reduce){.catfold .cat-head .chev{transition:none;}}

  .chipbar{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px;}
  .chip{display:flex;align-items:center;gap:7px;appearance:none;border:1px solid var(--line-strong);
    background:var(--surface);color:var(--ink-2);border-radius:20px;padding:7px 14px;
    font-size:13px;font-weight:650;cursor:pointer;font-family:inherit;}
  .chip .cdot{width:9px;height:9px;border-radius:3px;}
  .chip .cn{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .chip.on .cn{color:var(--accent-ink);opacity:.85;}
  .chipgrid{margin-top:12px;}

  /* ---- overview list view (photo-less, like the sheet's first page) ---- */
  .listcols{display:grid;grid-template-columns:1fr;gap:18px;align-items:start;margin-top:16px;}
  .bag-title{display:flex;align-items:baseline;gap:8px;font-size:16px;font-weight:800;margin:2px 0 8px;letter-spacing:-.01em;}
  .bag-title .n{font-size:12px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;}
  .ltable{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);}
  .lcat{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--surface-2);
    border-top:1px solid var(--line);font-size:12px;font-weight:750;color:var(--ink-2);}
  .ltable .lcat:first-child{border-top:0;}
  .lcat .cat-chip{width:9px;height:9px;}
  .lcat .n{margin-left:auto;font-size:11px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;}
  .lrow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);
    font-size:13.5px;cursor:pointer;}
  .lrow:hover{background:var(--accent-soft);}
  .lrow .lr-name{flex:1;min-width:0;word-break:break-word;}
  .lrow .lr-qty{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;}
  .lrow .lr-qty .u{font-weight:500;font-size:11px;color:var(--muted);margin-left:1px;}

  /* ---- desktop: photo-card gallery (like the original sheet) ---- */
  @media(min-width:900px){
    .wrap{max-width:1880px;padding-left:28px;padding-right:28px;}
    .titlebar{max-width:1880px;padding:0 28px;}
    .segmented{max-width:calc(1880px - 56px);width:calc(100% - 56px);margin-left:auto;margin-right:auto;}
    .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
    .item{
      flex-direction:column;align-items:stretch;gap:9px;padding:10px 10px 12px;
      border-left:1px solid var(--line);border-top:4px solid var(--catc,var(--line-strong));
    }
    .thumb{width:100%;height:auto;aspect-ratio:4/3;border-radius:8px;}
    .thumb .ph{font-size:30px;}
    .thumb.hasimg::after{border-radius:8px;}
    .it-main{flex:none;}
    .it-name{font-size:14px;min-height:2.6em;}
    .it-right{justify-content:space-between;width:100%;}
    .fab{right:max(28px,calc(50% - 940px + 28px));}
    /* photo view: all categories start at the top as side-by-side vertical columns;
       browse horizontally. 2 cards wide normally, 1 card wide when <=4 items. */
    .catcols{display:flex;gap:20px;align-items:flex-start;margin-top:16px;
      overflow-x:auto;padding-bottom:14px;}
    .catcols .cat{flex:0 0 auto;width:444px;margin:0;}
    .catcols .cat.narrow{width:216px;}
    .catcols .grid{grid-template-columns:1fr 1fr;}
    .catcols .cat.narrow .grid{grid-template-columns:1fr;}
    .catcols .cat-head{position:static;}

    /* photo view (v): same category blocks, wrapped into page columns — vertical scroll only */
    .catcols-v{column-width:452px;column-gap:20px;margin-top:16px;}
    .catcols-v .cat{break-inside:avoid;margin:0 0 20px;}
    .catcols-v .grid{grid-template-columns:1fr 1fr;}
    .catcols-v .cat-head{position:static;}

    /* overview list: Basic narrow, Pro wide with its rows flowing into 2 inner columns */
    .listcols{grid-template-columns:1fr 2fr;gap:22px;}
    .lbag-pro .ltable{column-count:2;column-gap:22px;column-rule:1px solid var(--line);padding:0 12px;}
    .lbag-pro .lcat,.lbag-pro .lrow{break-inside:avoid;padding-left:2px;padding-right:2px;}
    .lbag-pro .lcat{border-radius:6px;border-top:0;margin-top:6px;padding-left:8px;}
    .lbag-pro .ltable{padding-top:6px;padding-bottom:10px;}
  }

  /* ---- toast ---- */
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));z-index:80;
    background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:22px;font-size:13.5px;font-weight:600;
    box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---- photo viewer ---- */
  .viewer{position:fixed;inset:0;z-index:90;background:rgba(8,12,16,.92);display:none;place-items:center;padding:20px;}
  .viewer.on{display:grid;}
  .viewer img{max-width:100%;max-height:82vh;border-radius:10px;}
  .viewer .close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.15);color:#fff;border:0;
    width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer;}
  .viewer .cap{position:absolute;bottom:24px;left:0;right:0;text-align:center;color:#fff;font-size:14px;padding:0 20px;}
</style>

<header class="app">
  <div class="titlebar">
    <div class="brand">
      <h1>HW 공구가방</h1>
      <span class="sub" id="subLabel">품목 인벤토리</span>
    </div>
    <button class="iconbtn" id="menuBtn" title="백업 / 복원 / 테마" aria-label="메뉴">⋯</button>
  </div>
  <div class="segmented" id="bagSeg" role="tablist">
    <button class="seg" role="tab" data-bag="list" aria-selected="false">리스트 <span class="cnt" id="cntAll">0</span></button>
    <button class="seg" role="tab" data-bag="basic" aria-selected="false">Basic <span class="cnt" id="cntBasic">0</span></button>
    <button class="seg" role="tab" data-bag="pro" aria-selected="true">Pro <span class="cnt" id="cntPro">0</span></button>
  </div>
  <div class="titlebar" style="margin-top:0;padding-top:0;">
    <div style="max-width:760px;margin:0 auto;width:100%;">
      <div class="toolbar">
        <div class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="searchInput" type="search" placeholder="품목 검색" autocomplete="off">
        </div>
        <select class="sort" id="sortSel" aria-label="정렬">
          <option value="cat">카테고리순</option>
          <option value="name">이름순</option>
          <option value="qtyDesc">수량 많은순</option>
          <option value="qtyAsc">수량 적은순</option>
        </select>
        <select class="sort" id="layoutSel" aria-label="보기 방식">
          <option value="filter">보기: 필터</option>
          <option value="fold">보기: 접기</option>
          <option value="v">보기: 세로 배열</option>
          <option value="h">보기: 가로 배열</option>
        </select>
      </div>
      <div class="summary" id="summary"></div>
    </div>
  </div>
</header>

<main class="wrap" id="list" aria-live="polite"></main>

<button class="fab" id="addBtn"><span style="font-size:19px;line-height:1;">＋</span> 품목 추가</button>

<!-- add/edit sheet -->
<div class="scrim" id="scrim"></div>
<section class="sheet" id="editSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grabber"></div>
  <h3 id="sheetTitle">품목 추가</h3>
  <div class="field photo-field">
    <div class="photo-prev" id="photoPrev"><span style="font-size:20px;">📷</span></div>
    <div style="flex:1;">
      <label>사진</label>
      <div style="display:flex;gap:8px;">
        <button type="button" class="btn" id="photoPick" style="flex:1;">사진 선택</button>
        <button type="button" class="btn" id="photoPaste" style="flex:1;">붙여넣기</button>
        <button type="button" class="btn ghost" id="photoClear">제거</button>
      </div>
      <input type="file" id="photoInput" accept="image/*" hidden>

  function applySeedPhotos(force){
    var ops=[];
    ["basic","pro"].forEach(function(bg){
      state.bags[bg].items.forEach(function(it){
        if((force||!it.photo)&&SEED_PHOTOS[it.name]){
          it.photo=true;dropURL(it.id);
          ops.push(idbPut(it.id,dataURLtoBlob(SEED_PHOTOS[it.name])));
        }
      });
    });
    return Promise.all(ops).then(function(){save();}).catch(function(){});
  }
  function maybeSeedPhotos(){
    var done=null;try{done=localStorage.getItem(PSEED_FLAG);}catch(e){}
    if(done===PSEED_VER)return Promise.resolve();
    // new seed version: refresh bundled photos (user photos on non-seed items are untouched)
    return applySeedPhotos(true).then(function(){
      try{localStorage.setItem(PSEED_FLAG,PSEED_VER);}catch(e){}
    });
  }

  /* ---------- IndexedDB for photos ---------- */
  var _db=null;
  function pubURL(id){ return SUPA_URL+"/storage/v1/object/public/"+PHOTO_BUCKET+"/"+encodeURIComponent(id)+"?t="+loadStamp; }
  function idbPut(id,blob){
    return supa.storage.from(PHOTO_BUCKET).upload(id, blob, {upsert:true, contentType:(blob&&blob.type)||"image/jpeg"})
      .then(function(r){ if(r&&r.error) throw r.error; });
  }
  function idbGet(id){ return fetch(pubURL(id)).then(function(r){ return r.ok?r.blob():null; }).catch(function(){ return null; }); }
  function idbDel(id){ return supa.storage.from(PHOTO_BUCKET).remove([id]).then(function(){},function(){}); }
  function idbAll(){
    var ids=[]; Object.keys(state.bags).forEach(function(bk){ (state.bags[bk].items||[]).forEach(function(it){ if(it.photo) ids.push(it.id); }); });
    var out={}; return Promise.all(ids.map(function(id){ return idbGet(id).then(function(b){ if(b) out[id]=b; }); })).then(function(){ return out; });
  }
  var urlCache={};
  function photoURL(id){ return Promise.resolve(pubURL(id)); }
  function dropURL(id){}

  /* resize a File to a JPEG blob, max edge 1024 */
  function resizeImage(file){
    return new Promise(function(res,rej){
      var fr=new FileReader();
      fr.onload=function(){
        var img=new Image();
        img.onload=function(){
          var max=1024,w=img.width,h=img.height;
          if(w>max||h>max){ if(w>=h){h=Math.round(h*max/w);w=max;} else {w=Math.round(w*max/h);h=max;} }
          var cv=document.createElement("canvas");cv.width=w;cv.height=h;
          cv.getContext("2d").drawImage(img,0,0,w,h);
          cv.toBlob(function(b){ b?res(b):rej(new Error("변환 실패")); },"image/jpeg",0.72);
        };
        img.onerror=function(){rej(new Error("이미지 로드 실패"));};
        img.src=fr.result;
      };
      fr.onerror=function(){rej(fr.error);};
      fr.readAsDataURL(file);
    });
  }

  var searchQ="",sortMode="cat";

  function render(){
    document.querySelectorAll(".seg").forEach(function(b){b.setAttribute("aria-selected",String(b.dataset.bag===uiBag));});
    $("#cntBasic").textContent=state.bags.basic.items.length;
    $("#cntPro").textContent=state.bags.pro.items.length;
    $("#cntAll").textContent=state.bags.basic.items.length+state.bags.pro.items.length;

    $("#subLabel").textContent=(uiBag==="pro"?"Pro":"Basic")+" 가방 인벤토리";

    var items=bag().items.slice();

      items=items.filter(function(it){return (it.name+" "+it.cat+" "+(it.note||"")).toLowerCase().indexOf(q)>=0;});}

    var totalQty=bag().items.reduce(function(a,it){return a+(Number(it.qty)||0);},0);

    var host=$("#list");

      return;
    }

    var html="";

      if(layoutMode==="filter"){
        html+=renderFilterLayout(items,cats);

        var wrapCls=layoutMode==="v"?"catcols-v":(layoutMode==="fold"?"catfold":"catcols");
        html+='<div class="'+wrapCls+'">';
        cats.forEach(function(cat){
          var group=items.filter(function(it){return it.cat===cat;});
          group.sort(function(a,b){return a.name.localeCompare(b.name,"ko");});
          if(!group.length) return;
          html+=catSection(cat,group);
        });

      var bg=state.bags[bk];

      if(q)items=items.filter(function(it){return (it.name+" "+it.cat+" "+(it.note||"")).toLowerCase().indexOf(q)>=0;});
      var cats=bg.categories.filter(function(c){return items.some(function(it){return it.cat===c;});});

  function catOrder(cat){var i=bag().categories.indexOf(cat);return i<0?999:i;}
  function renderFilterLayout(items,cats){
    if(filterCat!=="전체"&&cats.indexOf(filterCat)<0)filterCat="전체";
    var counts={};items.forEach(function(it){counts[it.cat]=(counts[it.cat]||0)+1;});
    var chips='<div class="chipbar">'+["전체"].concat(cats).map(function(c){
      var on=c===filterCat;
      return '<button class="chip'+(on?' on':'')+'" data-act="chip" data-cat="'+esc(c)+'">'+
        (c!=="전체"?'<span class="cdot" style="background:'+catColor(c)+'"></span>':'')+
        esc(c)+'<span class="cn">'+(c==="전체"?items.length:(counts[c]||0))+'</span></button>';
    }).join("")+'</div>';
    var pool=filterCat==="전체"?items.slice():items.filter(function(it){return it.cat===filterCat;});
    pool.sort(function(a,b){return (catOrder(a.cat)-catOrder(b.cat))||a.name.localeCompare(b.name,"ko");});
    return chips+'<div class="grid chipgrid">'+pool.map(itemCard).join("")+'</div>';
  }
  function itemCard(it){
    var c=catColor(it.cat);
    return '<div class="item" style="--catc:'+c+'" data-id="'+it.id+'">'+
      '<div class="thumb'+(it.photo?' hasimg':'')+'" data-act="photo" data-id="'+it.id+'">'+
        (it.photo?'<img data-photo="'+it.id+'" alt="'+esc(it.name)+'">':'<span class="ph">📷</span>')+'</div>'+
      '<div class="it-main">'+
        '<div class="it-name">'+esc(it.name)+'</div>'+
        (it.note?'<div class="it-note">'+esc(it.note)+'</div>':'')+
      '</div>'+
      '<div class="it-right">'+
        '<div class="stepper">'+
          '<button data-act="dec" data-id="'+it.id+'" aria-label="수량 감소">−</button>'+
          '<span class="qty">'+it.qty+'<span class="u">'+esc(it.unit||"")+'</span></span>'+
          '<button data-act="inc" data-id="'+it.id+'" aria-label="수량 증가">+</button>'+
        '</div>'+
        '<button class="kebab" data-act="edit" data-id="'+it.id+'" aria-label="편집">✎</button>'+
      '</div>'+
    '</div>';
  }
  function hydratePhotos(){
    document.querySelectorAll("img[data-photo]").forEach(function(img){
      photoURL(img.getAttribute("data-photo")).then(function(u){ if(u) img.src=u; });
    });
  }

  function bagOf(key){return state.bags[key];}
  function locate(id){
    var keys=["basic","pro"];
    for(var b=0;b<keys.length;b++){
      var a=state.bags[keys[b]].items;
      for(var i=0;i<a.length;i++)if(a[i].id===id)return {it:a[i],bk:keys[b]};
    }
    return null;
  }
  function findItem(id){var L=locate(id);return L?L.it:null;}

  /* ---------- quantity ---------- */
  function changeQty(id,delta){
    var it=findItem(id);if(!it)return;
    it.qty=Math.max(0,(Number(it.qty)||0)+delta);save();render();
  }

  /* ---------- edit sheet ---------- */
  var editing=null, editBagKey="pro", pendingPhotoBlob=undefined; // undefined=no change, null=clear, Blob=new
  var NEW_CAT="__new__";
  function refreshCatList(selectedCat){
    var sel=$("#fCatSel");
    var cats=bagOf(editBagKey).categories.slice();
    if(selectedCat&&cats.indexOf(selectedCat)<0)cats.push(selectedCat);
    sel.innerHTML=cats.map(function(c){
      return '<option value="'+esc(c)+'"'+(c===selectedCat?' selected':'')+'>'+esc(c)+'</option>';
    }).join("")+'<option value="'+NEW_CAT+'">＋ 새 카테고리 만들기</option>';
    $("#fCatNew").style.display="none";$("#fCatNew").value="";
  }
  $("#fCatSel").addEventListener("change",function(){
    var isNew=this.value===NEW_CAT;
    $("#fCatNew").style.display=isNew?"block":"none";
    if(isNew)setTimeout(function(){$("#fCatNew").focus();},50);
  });
  function openEdit(id){
    var L=id?locate(id):null;
    editing=L?L.it:null;
    editBagKey=L?L.bk:(uiBag==="list"?"pro":uiBag);
    pendingPhotoBlob=undefined;
    refreshCatList(editing?editing.cat:(bagOf(editBagKey).categories[0]||""));
    $("#sheetTitle").textContent=editing?"품목 편집":"품목 추가";
    $("#deleteRow").style.display=editing?"flex":"none";
    $("#fName").value=editing?editing.name:"";
    $("#fQty").value=editing?editing.qty:1;
    $("#fUnit").value=editing?(editing.unit||"개"):"개";
    $("#fNote").value=editing?(editing.note||""):"";
    var prev=$("#photoPrev");prev.innerHTML='<span style="font-size:20px;">📷</span>';
    if(editing&&editing.photo){ photoURL(editing.id).then(function(u){ if(u)prev.innerHTML='<img src="'+u+'" alt="">'; }); }
    showSheet("#editSheet");
    setTimeout(function(){$("#fName").focus();},250);
  }
  function saveEdit(){
    var name=$("#fName").value.trim();
    if(!name){toast("품목 이름을 입력하세요");$("#fName").focus();return;}
    var selVal=$("#fCatSel").value;
    var cat=selVal===NEW_CAT?$("#fCatNew").value.trim():selVal;
    if(!cat){toast("새 카테고리 이름을 입력하세요");$("#fCatNew").focus();return;}
    var qty=Math.max(0,parseInt($("#fQty").value,10)||0);
    var unit=$("#fUnit").value.trim()||"개";
    var note=$("#fNote").value.trim();
    var eb=bagOf(editBagKey);
    if(eb.categories.indexOf(cat)<0) eb.categories.push(cat);

    var it=editing;
    if(!it){ it={id:uid(),cat:cat,name:name,qty:qty,unit:unit,note:note,photo:false}; eb.items.push(it); }
    else { it.cat=cat;it.name=name;it.qty=qty;it.unit=unit;it.note=note; }

    var after=function(){ save(); render(); hideSheets(); toast(editing?"수정했어요":"추가했어요"); editing=null; };
    if(pendingPhotoBlob===null){ it.photo=false; dropURL(it.id); idbDel(it.id).then(after); }
    else if(pendingPhotoBlob instanceof Blob){
      it.photo=true; dropURL(it.id);
      var puts=[idbPut(it.id,pendingPhotoBlob)], synced=0;
      Object.keys(state.bags).forEach(function(bk){
        state.bags[bk].items.forEach(function(x){
          if(x.id!==it.id && x.name===it.name){ x.photo=true; dropURL(x.id); puts.push(idbPut(x.id,pendingPhotoBlob)); synced++; }
        });
      });
      Promise.all(puts).then(function(){ save(); render(); hideSheets(); toast(synced>0?("사진 저장 · 같은 이름 "+synced+"곳에도 반영"):(editing?"수정했어요":"추가했어요")); editing=null; });
    }
    else { after(); }
  }
  /* confirm() is blocked inside the artifact sandbox — use two-step arming instead */
  function twoStep(btn,armedText,action){
    btn.addEventListener("click",function(){
      if(btn.dataset.armed==="1"){disarm(btn);action();}
      else{
        if(!btn.dataset.orig)btn.dataset.orig=btn.textContent;
        btn.dataset.armed="1";btn.textContent=armedText;btn.classList.add("armed");
        clearTimeout(btn._t);
        btn._t=setTimeout(function(){disarm(btn);},4000);
      }
    });
  }
  function disarm(btn){
    if(btn&&btn.dataset.armed==="1"){
      clearTimeout(btn._t);btn.dataset.armed="";
      btn.textContent=btn.dataset.orig;btn.classList.remove("armed");
    }
  }
  function deleteEditing(){
    if(!editing)return;
    var id=editing.id,eb=bagOf(editBagKey);
    eb.items=eb.items.filter(function(x){return x.id!==id;});
    dropURL(id); idbDel(id);
    save();render();hideSheets();toast("삭제했어요");editing=null;
  }

  /* ---------- photo pick ---------- */
  function applyPhotoFile(f){
    if(!f) return;
    resizeImage(f).then(function(blob){
      pendingPhotoBlob=blob;
      var u=URL.createObjectURL(blob);
      $("#photoPrev").innerHTML='<img src="'+u+'" alt="">';
    }).catch(function(){toast("사진을 처리할 수 없어요");});
  }
  function editSheetOpen(){ var e=$("#editSheet"); return !!e && e.classList.contains("on"); }
  function imageFromTransfer(dt){
    if(!dt) return null;
    if(dt.files&&dt.files.length){ for(var i=0;i<dt.files.length;i++){ if((dt.files[i].type||"").indexOf("image/")===0) return dt.files[i]; } }
    if(dt.items&&dt.items.length){ for(var j=0;j<dt.items.length;j++){ var it=dt.items[j]; if(it.kind==="file"&&(it.type||"").indexOf("image/")===0){ var g=it.getAsFile(); if(g) return g; } } }
    return null;
  }
  $("#photoPick").addEventListener("click",function(){$("#photoInput").click();});
  $("#photoInput").addEventListener("change",function(e){
    applyPhotoFile(e.target.files&&e.target.files[0]); e.target.value="";
  });
  $("#photoClear").addEventListener("click",function(){
    pendingPhotoBlob=null; $("#photoPrev").innerHTML='<span style="font-size:20px;">📷</span>';
  });
  $("#photoPaste").addEventListener("click",function(){
    if(navigator.clipboard&&navigator.clipboard.read){
      navigator.clipboard.read().then(function(items){
        for(var i=0;i<items.length;i++){
          var types=items[i].types||[];
          for(var k=0;k<types.length;k++){
            if(types[k].indexOf("image/")===0){ items[i].getType(types[k]).then(applyPhotoFile); return; }
          }
        }
        toast("클립보드에 이미지가 없어요 — 이미지 복사 후 Ctrl+V");
      }).catch(function(){ toast("사진 칸을 누르고 Ctrl+V 로 붙여넣으세요"); });
    } else { toast("사진 칸을 누르고 Ctrl+V 로 붙여넣으세요"); }
  });
  document.addEventListener("paste",function(e){
    if(!editSheetOpen()) return;
    var f=imageFromTransfer(e.clipboardData);
    if(f){ e.preventDefault(); applyPhotoFile(f); toast("붙여넣은 사진을 넣었어요"); }
  });
  (function(){
    var pf=$("#photoPrev"); if(!pf) return;
    ["dragenter","dragover"].forEach(function(ev){ pf.addEventListener(ev,function(e){ e.preventDefault(); e.stopPropagation(); pf.classList.add("dragover"); }); });
    ["dragleave","dragend","drop"].forEach(function(ev){ pf.addEventListener(ev,function(e){ pf.classList.remove("dragover"); }); });
    pf.addEventListener("drop",function(e){ e.preventDefault(); e.stopPropagation(); var f=imageFromTransfer(e.dataTransfer); if(f){ applyPhotoFile(f); toast("놓은 사진을 넣었어요"); } else { toast("이미지 파일만 넣을 수 있어요"); } });
  })();

  /* ---------- photo viewer ---------- */
  function viewPhoto(id){
    var it=findItem(id);if(!it||!it.photo){ openEdit(id); return; }
    photoURL(id).then(function(u){ if(!u){openEdit(id);return;}
      $("#viewerImg").src=u; $("#viewerCap").textContent=it.name; $("#viewer").classList.add("on");
    });
  }
  $("#viewerClose").addEventListener("click",function(){$("#viewer").classList.remove("on");});
  $("#viewer").addEventListener("click",function(e){if(e.target.id==="viewer")this.classList.remove("on");});

  /* ---------- sheet plumbing ---------- */
  function showSheet(sel){$("#scrim").classList.add("on");$(sel).classList.add("on");}
  function hideSheets(){
    $("#scrim").classList.remove("on");
    document.querySelectorAll(".sheet").forEach(function(s){s.classList.remove("on");});
    ["deleteBtn","importBtn","resetBtn","pasteRestore"].forEach(function(id){disarm(document.getElementById(id));});
  }
  $("#scrim").addEventListener("click",hideSheets);
  $("#cancelBtn").addEventListener("click",hideSheets);
  $("#menuClose").addEventListener("click",hideSheets);
  $("#saveBtn").addEventListener("click",saveEdit);
  twoStep($("#deleteBtn"),"한 번 더 누르면 삭제됩니다",deleteEditing);
  $("#addBtn").addEventListener("click",function(){openEdit(null);});
  $("#menuBtn").addEventListener("click",function(){showSheet("#menuSheet");});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"){hideSheets();$("#viewer").classList.remove("on");}});

  /* ---------- list delegation ---------- */
  $("#list").addEventListener("click",function(e){
    var b=e.target.closest("[data-act]");if(!b)return;
    var id=b.getAttribute("data-id"),act=b.getAttribute("data-act");
    if(act==="inc")changeQty(id,1);
    else if(act==="dec")changeQty(id,-1);
    else if(act==="edit")openEdit(id);
    else if(act==="photo")viewPhoto(id);
    else if(act==="fold"){
      var key=uiBag+"|"+b.getAttribute("data-cat");
      expandedCats[key]=!expandedCats[key];
      b.closest(".cat").classList.toggle("folded",!expandedCats[key]);
    }
    else if(act==="chip"){filterCat=b.getAttribute("data-cat");render();}
  });
  $("#list").addEventListener("keydown",function(e){
    if(e.key!=="Enter"&&e.key!==" ")return;
    var b=e.target.closest('[data-act="fold"]');if(!b)return;
    e.preventDefault();b.click();
  });

  /* ---------- bag / search / sort ---------- */
  $("#bagSeg").addEventListener("click",function(e){
    var b=e.target.closest(".seg");if(!b)return;uiBag=b.dataset.bag;searchQ="";$("#searchInput").value="";render();
  });
  $("#searchInput").addEventListener("input",function(e){searchQ=e.target.value.trim();render();});
  $("#sortSel").addEventListener("change",function(e){sortMode=e.target.value;render();});
  $("#layoutSel").addEventListener("change",function(e){
    layoutMode=e.target.value;
    try{localStorage.setItem("hw_toolbag_layout",layoutMode);}catch(err){}
    render();
  });
  $("#layoutSel").value=layoutMode;

  /* ---------- theme ---------- */
  var TKEY="hw_toolbag_theme";
  (function(){var t=null;try{t=localStorage.getItem(TKEY);}catch(e){} if(t)document.documentElement.setAttribute("data-theme",t);})();
  $("#themeBtn").addEventListener("click",function(){
    var cur=document.documentElement.getAttribute("data-theme");
    var next=cur==="dark"?"light":(cur==="light"?"dark":(matchMedia("(prefers-color-scheme: dark)").matches?"light":"dark"));
    document.documentElement.setAttribute("data-theme",next);
    try{localStorage.setItem(TKEY,next);}catch(e){}
    toast(next==="dark"?"어두운 테마":"밝은 테마");
  });

  /* ---------- export / import ---------- */
  function blobToDataURL(b){return new Promise(function(res){var fr=new FileReader();fr.onload=function(){res(fr.result);};fr.readAsDataURL(b);});}
  function dataURLtoBlob(d){var p=d.split(",");var m=/:(.*?);/.exec(p[0]);var mime=m?m[1]:"image/jpeg";
    var bin=atob(p[1]);var n=bin.length;var u=new Uint8Array(n);while(n--)u[n]=bin.charCodeAt(n);return new Blob([u],{type:mime});}

  function buildBackupJSON(){
    return idbAll().then(function(photos){
      var enc=Object.keys(photos).map(function(id){return blobToDataURL(photos[id]).then(function(d){return [id,d];});});
      return Promise.all(enc);
    }).then(function(pairs){
      var photoMap={};pairs.forEach(function(p){photoMap[p[0]]=p[1];});
      return JSON.stringify({app:"hw-toolbag",version:1,exportedAt:new Date().toISOString(),state:state,photos:photoMap});
    });
  }
  function applyBackupText(text){
    var data=JSON.parse(text);
    if(!data.state||!data.state.bags)throw new Error("형식 오류");
    state=data.state;save();
    Object.keys(urlCache).forEach(dropURL);
    var photos=data.photos||{};
    var puts=Object.keys(photos).map(function(id){return idbPut(id,dataURLtoBlob(photos[id]));});
    return Promise.all(puts).then(function(){render();hideSheets();toast("복원했어요");});
  }
  $("#exportBtn").addEventListener("click",function(){
    buildBackupJSON().then(function(json){
      var blob=new Blob([json],{type:"application/json"});
      var url=URL.createObjectURL(blob);var a=document.createElement("a");
      a.href=url;a.download="공구가방-백업-"+new Date().toISOString().slice(0,10)+".json";
      document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},1000);
      toast("다운로드 폴더 확인 — 파일이 없으면 '텍스트 복사' 사용");
    }).catch(function(){toast("백업에 실패했어요");});
  });
  $("#copyBtn").addEventListener("click",function(){
    buildBackupJSON().then(function(json){
      return navigator.clipboard.writeText(json).then(function(){
        hideSheets();toast("복사됨 — 메모장·카톡 등에 붙여넣어 보관하세요");
      },function(){
        // clipboard blocked: show the text for manual copy
        hideSheets();showSheet("#pasteSheet");
        $("#pasteTitle").textContent="아래 내용을 전체 선택해 복사하세요";
        var ta=$("#pasteArea");ta.value=json;ta.focus();ta.select();
      });
    }).catch(function(){toast("백업에 실패했어요");});
  });
  twoStep($("#importBtn"),"현재 데이터를 덮어씁니다 — 한 번 더 누르면 파일 선택",function(){$("#importInput").click();});
  $("#importInput").addEventListener("change",function(e){
    var f=e.target.files&&e.target.files[0];if(!f)return;e.target.value="";
    var fr=new FileReader();
    fr.onload=function(){
      try{ applyBackupText(fr.result); }
      catch(err){toast("파일을 읽을 수 없어요");}
    };
    fr.readAsText(f);
  });
  $("#pasteBtn").addEventListener("click",function(){
    hideSheets();
    $("#pasteTitle").textContent="백업 텍스트 붙여넣기";
    $("#pasteArea").value="";
    showSheet("#pasteSheet");
  });
  $("#pasteClose").addEventListener("click",hideSheets);
  twoStep($("#pasteRestore"),"현재 데이터를 덮어씁니다 — 한 번 더",function(){
    try{ applyBackupText($("#pasteArea").value.trim()); }
    catch(err){toast("텍스트를 읽을 수 없어요 — 백업 전체가 복사됐는지 확인하세요");}
  });
  twoStep($("#resetBtn"),"모든 변경이 사라집니다 — 한 번 더 누르면 초기화",function(){
    Promise.all([supa.from("toolbag_items").delete().gte("sort",0), supa.from("toolbag_bags").delete().neq("bag","__none__")]).then(function(){
      state=buildFromSeed();
      pushAll().then(function(){ return applySeedPhotos(true); }).then(function(){ loadStamp=String(Date.now()); render();hideSheets();toast("초기화했어요"); });
    });
  });

  /* ---------- header height -> sticky offset for category titles ---------- */
  var _remoteT=null;
  function subscribeRealtime(){
    try{
      supa.channel("tb-rt")
        .on("postgres_changes",{event:"*",schema:"public",table:"toolbag_items"}, onRemote)
        .on("postgres_changes",{event:"*",schema:"public",table:"toolbag_bags"}, onRemote)
        .subscribe();
    }catch(e){}
  }
  function onRemote(){
    if(Date.now()-localWrite<1500) return;
    clearTimeout(_remoteT);
    _remoteT=setTimeout(function(){ load().then(function(){ render(); syncHeaderH(); }); }, 400);
  }
  function syncHeaderH(){
    var h=document.querySelector("header.app");
    if(h)document.documentElement.style.setProperty("--headerH",h.offsetHeight+"px");
  }
  window.addEventListener("resize",syncHeaderH);

  /* ---------- go ---------- */
  // Embedded (artifact iframe): file downloads are silently blocked by the sandbox,
  // so hide the file-download backup and leave the clipboard/text path as primary.
  if(window.self!==window.top){
    $("#exportBtn").style.display="none";
    $("#copyBtn").textContent="데이터 백업 — 텍스트 복사 (사진 포함)";
  }
  /* backfill: same-named items in other bags inherit an existing photo (fills empty ones only) */
  function syncPhotosByName(){
    var srcByName={};
    Object.keys(state.bags).forEach(function(bk){
      (state.bags[bk].items||[]).forEach(function(it){
        if(it.photo && !srcByName[it.name]) srcByName[it.name]=it.id;
      });
    });
    var jobs=[];
    Object.keys(state.bags).forEach(function(bk){
      (state.bags[bk].items||[]).forEach(function(it){
        if(!it.photo && srcByName[it.name] && srcByName[it.name]!==it.id){
          var tgt=it, srcId=srcByName[it.name];
          jobs.push(idbGet(srcId).then(function(blob){
            if(blob){ tgt.photo=true; dropURL(tgt.id); return idbPut(tgt.id,blob); }
          }));
        }
      });
    });
    if(!jobs.length) return Promise.resolve(false);
    return Promise.all(jobs).then(function(){ save(); return true; });
  }
  state={version:1,bags:{basic:{categories:[],items:[]},pro:{categories:[],items:[]}}};
  render();
  syncHeaderH();
  load().then(function(seeded){
    render(); syncHeaderH();
    return seeded ? applySeedPhotos(true) : Promise.resolve();
  }).then(function(){ loadStamp=String(Date.now()); return syncPhotosByName(); })
    .then(function(){ render(); syncHeaderH(); subscribeRealtime(); })
    .catch(function(e){ toast("연결 오류 — 새로고침 해보세요"); });
})();
</script>
</body>
</html>
